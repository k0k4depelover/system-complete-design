<h2 id="f-arquitecturas">arquitecturas</h2>

<title id="f24ct">Cascada contra speech-to-speech</title>

<h2 id="f-secuencia">secuencia</h2>
<figure class="figure"><div class="figure-frame">
<svg viewBox="0 0 770 616" role="img" aria-labelledby="f24qt f24qd">
<title id="f24qt">Un turno de voz en cascada, salto por salto</title>
<desc id="f24qd">El usuario termina de decir &quot;Quiero cambiar mi vuelo del viernes&quot;. El último cuadro tarda 30 ms en capturarse y 25 ms en llegar al SFU, que lo reenvía al worker. El jitter buffer agrega 30 ms. El STT ya transcribió casi todo y entrega un parcial; el detector de fin de turno cierra el turno a los 250 ms de silencio. El final del STT llega 50 ms después. El LLM entrega el primer token a los 150 ms y la primera frase completa 100 ms más tarde. El TTS devuelve el primer audio en 80 ms. El audio vuelve al SFU y al usuario en 25 ms y se reproduce después de 40 ms de buffer: 780 ms en total.</desc>

<h2 id="f-pilas">pilas</h2>
<figure class="figure"><div class="figure-frame">
<svg viewBox="0 0 770 300" role="img" aria-labelledby="f24pt f24pd">
<title id="f24pt">Qué hay debajo del audio en WebRTC y en un WebSocket</title>
<desc id="f24pd">A la izquierda, WebRTC: el audio en Opus va en paquetes SRTP, con RTCP para medir pérdida y jitter; las claves se negocian con DTLS; ICE, con STUN y TURN, encuentra un camino a través del NAT; todo sobre UDP e IP. Un paquete perdido se disimula y el audio sigue. A la derecha, un WebSocket: el audio va en mensajes sobre TLS y TCP. Una pérdida frena todo lo que viene detrás hasta que TCP la retransmite: head-of-line blocking.</desc>

<h2 id="f-bargein">bargein</h2>

<h2 id="f-aws">aws</h2>

<title id="f24wt">Un agente de voz en AWS</title>
